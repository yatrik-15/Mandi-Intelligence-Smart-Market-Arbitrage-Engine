<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Mandi Intelligence – BeejRakshak</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --green: #22c55e;
            --green-d: #16a34a;
            --green-g: #4ade80;
            --amber: #f59e0b;
            --bg: #070c18;
            --card: #0f1724;
            --card2: #162031;
            --border: #1e2d42;
            --text: #f1f5f9;
            --muted: #64748b;
            --accent: #38bdf8;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ═══════════════════════════════════
       STICKY HEADER
    ═══════════════════════════════════ */
        header {
            width: 100%;
            padding: 1.1rem 2rem;
            display: flex;
            align-items: center;
            gap: .75rem;
            background: rgba(7, 12, 24, .92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header .logo {
            font-size: 1.5rem
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 700
        }

        header span {
            color: var(--green)
        }

        .badge {
            margin-left: auto;
            background: rgba(34, 197, 94, .12);
            color: var(--green);
            border: 1px solid rgba(34, 197, 94, .25);
            border-radius: 999px;
            padding: .2rem .8rem;
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .08em;
        }

        /* ═══════════════════════════════════
       HERO SECTION — HANDSHAKE ANIMATION
    ═══════════════════════════════════ */
        .hero-section {
            width: 100%;
            background: #e8e2d8;
            /* beige, like getnudge */
            position: relative;
            overflow: hidden;
            min-height: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* top text area */
        .hero-text {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 3.5rem 1rem 1.5rem;
            max-width: 700px;
        }

        .hero-text h2 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 900;
            line-height: 1.15;
            color: #111;
        }

        .hero-text h2 em {
            font-style: normal;
            color: var(--green-d);
        }

        .hero-text p {
            margin-top: .7rem;
            color: #555;
            font-size: 1rem;
            line-height: 1.6;
        }

        /* accuracy chips */
        .hero-chips {
            display: flex;
            gap: .6rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 1rem;
        }

        .chip {
            background: rgba(34, 197, 94, .12);
            border: 1px solid rgba(34, 197, 94, .3);
            border-radius: 999px;
            padding: .28rem .82rem;
            font-size: .72rem;
            font-weight: 700;
            color: var(--green-d);
        }

        /* ── Hands animation container ── */
        .hands-stage {
            position: relative;
            width: 100%;
            height: 320px;
            margin-top: .5rem;
            overflow: hidden;
        }

        /*
      We show the SAME image twice.
      Left div is clipped to the left half → starts off-screen left.
      Right div is clipped to the right half → starts off-screen right.
    */
        .hand-half {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('/static/handshake.png');
            background-size: auto 100%;
            background-repeat: no-repeat;
            mix-blend-mode: multiply;
            /* same technique as getnudge */
        }

        .hand-left {
            background-position: center center;
            clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
            transform: translateX(-60%);
            animation: slideInLeft 1.4s cubic-bezier(.22, .68, 0, 1.2) 0.3s forwards;
        }

        .hand-right {
            background-position: center center;
            clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%);
            transform: translateX(60%);
            animation: slideInRight 1.4s cubic-bezier(.22, .68, 0, 1.2) 0.3s forwards;
        }

        @keyframes slideInLeft {
            to {
                transform: translateX(0)
            }
        }

        @keyframes slideInRight {
            to {
                transform: translateX(0)
            }
        }

        /* subtle vignette to fade edges */
        .hands-stage::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 2;
            background:
                linear-gradient(to right, #e8e2d8 0%, transparent 12%, transparent 88%, #e8e2d8 100%),
                linear-gradient(to bottom, transparent 70%, #e8e2d8 100%);
            pointer-events: none;
        }

        /* ═══════════════════════════════════
       MAIN CONTENT — dark background
    ═══════════════════════════════════ */
        .main-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg);
            padding-top: 3rem;
        }

        /* ── Form Card ── */
        .form-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            padding: 1.75rem;
            width: min(600px, 95vw);
            box-shadow: 0 12px 48px rgba(0, 0, 0, .5);
        }

        .field {
            margin-bottom: 1.2rem
        }

        label {
            display: block;
            font-size: .78rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: .4rem;
        }

        input[type="number"] {
            width: 100%;
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: .6rem;
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            padding: .72rem 1rem;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        input[type="number"]:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, .12);
        }

        .crop-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: .65rem
        }

        .crop-btn {
            background: var(--card2);
            border: 1.5px solid var(--border);
            border-radius: .85rem;
            padding: .85rem .5rem;
            cursor: pointer;
            text-align: center;
            transition: all .2s;
            color: var(--text);
            font-size: .82rem;
            font-weight: 700;
        }

        .crop-btn .icon {
            font-size: 2rem;
            display: block;
            margin-bottom: .25rem
        }

        .crop-btn:hover {
            border-color: var(--green);
            background: rgba(34, 197, 94, .07)
        }

        .crop-btn.active {
            border-color: var(--green);
            background: rgba(34, 197, 94, .13);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, .12), 0 0 20px rgba(34, 197, 94, .12);
        }

        .submit-btn {
            width: 100%;
            padding: .9rem;
            margin-top: .5rem;
            background: linear-gradient(135deg, var(--green), var(--green-d));
            border: none;
            border-radius: .75rem;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: .02em;
            transition: opacity .2s, transform .15s, box-shadow .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            box-shadow: 0 4px 20px rgba(34, 197, 94, .35);
        }

        .submit-btn:hover {
            opacity: .9;
            transform: translateY(-1px);
            box-shadow: 0 8px 28px rgba(34, 197, 94, .45)
        }

        .submit-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none;
            box-shadow: none
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, .25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        /* ── Results ── */
        #results {
            width: min(640px, 95vw);
            margin-top: 2rem;
            margin-bottom: 4rem
        }

        .summary-bar {
            background: rgba(56, 189, 248, .07);
            border: 1px solid rgba(56, 189, 248, .18);
            border-radius: .85rem;
            padding: .85rem 1rem;
            font-size: .85rem;
            color: var(--accent);
            margin-bottom: 1.75rem;
            line-height: 1.55;
            animation: fadeUp .3s ease;
        }

        /* BEST CARD */
        .winner-wrap {
            position: relative;
            margin-bottom: 2rem;
            animation: fadeUp .35s ease
        }

        .winner-wrap::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 1.4rem;
            background: linear-gradient(135deg, var(--green), var(--green-g), var(--green-d));
            z-index: 0;
            animation: borderPulse 3s ease-in-out infinite;
        }

        @keyframes borderPulse {

            0%,
            100% {
                opacity: .7;
                filter: blur(0px)
            }

            50% {
                opacity: 1;
                filter: blur(2px)
            }
        }

        .best-card {
            position: relative;
            z-index: 1;
            background: linear-gradient(160deg, #0e1e12 0%, #0f1724 60%);
            border-radius: 1.3rem;
            padding: 2rem;
            overflow: hidden;
        }

        .best-card::after {
            content: '';
            position: absolute;
            top: -40px;
            right: -40px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(34, 197, 94, .18) 0%, transparent 70%);
            pointer-events: none;
        }

        .winner-label {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            background: linear-gradient(90deg, var(--green), var(--green-g));
            color: #0a1a0a;
            font-size: .7rem;
            font-weight: 900;
            letter-spacing: .1em;
            text-transform: uppercase;
            border-radius: 999px;
            padding: .28rem .85rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 12px rgba(34, 197, 94, .4);
        }

        .best-mandi-name {
            font-size: clamp(1.8rem, 5vw, 2.4rem);
            font-weight: 900;
            line-height: 1;
            color: #fff;
            text-shadow: 0 0 30px rgba(34, 197, 94, .4);
            margin-bottom: .4rem;
        }

        .best-tagline {
            font-size: .85rem;
            color: rgba(255, 255, 255, .45);
            margin-bottom: 1.5rem
        }

        .profit-hero {
            background: rgba(34, 197, 94, .1);
            border: 1px solid rgba(34, 197, 94, .25);
            border-radius: 1rem;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: .75rem;
        }

        .profit-label {
            font-size: .75rem;
            font-weight: 700;
            color: rgba(255, 255, 255, .4);
            text-transform: uppercase;
            letter-spacing: .08em
        }

        .profit-value {
            font-size: clamp(2rem, 6vw, 2.8rem);
            font-weight: 900;
            color: var(--green-g);
            line-height: 1;
            text-shadow: 0 0 24px rgba(74, 222, 128, .5);
        }

        .profit-sub {
            font-size: .78rem;
            color: rgba(255, 255, 255, .35);
            margin-top: .2rem
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: .6rem
        }

        @media(min-width:480px) {
            .stats-row {
                grid-template-columns: repeat(4, 1fr)
            }
        }

        .stat-box {
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .06);
            border-radius: .75rem;
            padding: .75rem;
            text-align: center;
        }

        .stat-box .sv {
            font-size: .95rem;
            font-weight: 800;
            color: #fff
        }

        .stat-box .sl {
            font-size: .65rem;
            color: var(--muted);
            margin-top: .2rem;
            text-transform: uppercase;
            letter-spacing: .05em
        }

        .action-badge {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            margin-top: 1.2rem;
            background: rgba(245, 158, 11, .12);
            border: 1px solid rgba(245, 158, 11, .3);
            border-radius: .6rem;
            padding: .55rem 1rem;
            font-size: .85rem;
            font-weight: 700;
            color: var(--amber);
            width: 100%;
            justify-content: center;
        }

        /* Alternatives */
        .alt-header {
            font-size: .72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--muted);
            margin-bottom: .75rem
        }

        .alt-list {
            display: flex;
            flex-direction: column;
            gap: .6rem
        }

        .alt-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: .9rem;
            padding: 1rem 1.1rem;
            display: flex;
            align-items: center;
            gap: .85rem;
            animation: fadeUp .4s ease;
            transition: border-color .2s, background .2s;
            opacity: .85;
        }

        .alt-card:hover {
            border-color: rgba(56, 189, 248, .3);
            background: rgba(56, 189, 248, .04);
            opacity: 1
        }

        .alt-rank {
            width: 1.9rem;
            height: 1.9rem;
            background: var(--card2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: .8rem;
            color: var(--muted);
            flex-shrink: 0;
        }

        .alt-info {
            flex: 1
        }

        .alt-name {
            font-weight: 700;
            font-size: .9rem
        }

        .alt-sub {
            font-size: .72rem;
            color: var(--muted);
            margin-top: .12rem
        }

        .alt-right {
            text-align: right
        }

        .alt-profit {
            font-size: .95rem;
            font-weight: 800;
            color: var(--green)
        }

        .alt-dist {
            font-size: .68rem;
            color: var(--muted);
            margin-top: .1rem
        }

        .error-box {
            background: rgba(239, 68, 68, .09);
            border: 1px solid rgba(239, 68, 68, .28);
            border-radius: .75rem;
            padding: 1rem 1.2rem;
            color: #f87171;
            font-size: .9rem;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }
    </style>
</head>

<body>

    <!-- ── Header ── -->
    <header>
        <div class="logo">🌱</div>
        <h1>Mandi <span>Intelligence</span></h1>
        <div class="badge">AI POWERED</div>
    </header>

    <!-- ══════════════════════════════════════
     HERO — Beige section with handshake
════════════════════════════════════════ -->
    <div class="hero-section">
        <div class="hero-text">
            <h2>Best Mandi Starts<br />with a <em>Smart Deal</em></h2>
            <p>ML-powered price predictions &amp; profit-optimised recommendations<br />for Gujarat farmers. Know where
                &amp; when to sell.</p>
            <div class="hero-chips">
                <div class="chip">🤖 XGBoost ML</div>
                <div class="chip">📈 ~97.6% Accuracy</div>
                <div class="chip">🗓️ 4 Years Data</div>
                <div class="chip">⚡ ₹0.40/kg Error</div>
            </div>
        </div>

        <!-- Handshake animation stage -->
        <div class="hands-stage">
            <div class="hand-half hand-left"></div>
            <div class="hand-half hand-right"></div>
        </div>
    </div>

    <!-- ══════════════════════════════════════
     MAIN DARK CONTENT
════════════════════════════════════════ -->
    <div class="main-content">

        <div class="form-card">
            <div class="field">
                <label>Select Crop</label>
                <div class="crop-grid">
                    <button class="crop-btn" data-crop="Onion" onclick="selectCrop(this)">
                        <span class="icon">🧅</span>Onion
                    </button>
                    <button class="crop-btn" data-crop="Tomato" onclick="selectCrop(this)">
                        <span class="icon">🍅</span>Tomato
                    </button>
                    <button class="crop-btn" data-crop="Potato" onclick="selectCrop(this)">
                        <span class="icon">🥔</span>Potato
                    </button>
                </div>
            </div>
            <div class="field">
                <label>Quantity (kg)</label>
                <input type="number" id="qty" placeholder="e.g. 500" min="1" step="1" />
            </div>
            <button class="submit-btn" id="submitBtn" onclick="fetchRecommendation()">
                <span id="btnText">🔍 Get Best Recommendation</span>
            </button>
        </div>

        <div id="results"></div>

    </div><!-- /main-content -->

    <script>
        let selectedCrop = null;

        function selectCrop(el) {
            document.querySelectorAll('.crop-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            selectedCrop = el.dataset.crop;
        }

        function fmt(n) {
            return '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        }

        async function fetchRecommendation() {
            const qty = parseFloat(document.getElementById('qty').value);
            const resultsEl = document.getElementById('results');
            const btn = document.getElementById('submitBtn');

            if (!selectedCrop) {
                resultsEl.innerHTML = `<div class="error-box">⚠️ Please select a crop first.</div>`;
                return;
            }
            if (!qty || qty <= 0) {
                resultsEl.innerHTML = `<div class="error-box">⚠️ Please enter a valid quantity.</div>`;
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<div class="spinner"></div><span>Analysing all mandis…</span>`;

            try {
                const API = window.location.protocol === 'file:' ? 'http://127.0.0.1:8000' : '';
                const res = await fetch(API + '/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ crop: selectedCrop, quantity: qty, farmer_location: 'Ahmedabad' })
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'Server error');
                }
                renderResults(await res.json());
            } catch (e) {
                resultsEl.innerHTML = `<div class="error-box">❌ ${e.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span id="btnText">🔍 Get Best Recommendation</span>`;
            }
        }

        function renderResults(data) {
            const best = data.best_option;
            const alts = data.alternatives;

            const pred7d = best.predicted_price_7d
                ? `<div class="stat-box"><div class="sv">${fmt(best.predicted_price_7d)}/kg</div><div class="sl">7-Day Forecast</div></div>`
                : `<div class="stat-box"><div class="sv">${fmt(best.storage_cost)}</div><div class="sl">Storage Cost</div></div>`;

            let altsHtml = '';
            alts.forEach((a, i) => {
                altsHtml += `
        <div class="alt-card">
          <div class="alt-rank">${i + 2}</div>
          <div class="alt-info">
            <div class="alt-name">${a.mandi_name}</div>
            <div class="alt-sub">${fmt(a.current_price)}/kg &nbsp;·&nbsp; ${a.recommendation}</div>
          </div>
          <div class="alt-right">
            <div class="alt-profit">${fmt(a.net_profit)}</div>
            <div class="alt-dist">${a.distance_km.toFixed(0)} km away</div>
          </div>
        </div>`;
            });

            document.getElementById('results').innerHTML = `
      <div class="summary-bar">💡 ${data.summary}</div>

      <div class="winner-wrap">
        <div class="best-card">
          <div class="winner-label">🏆 &nbsp;#1 Best Mandi</div>
          <div class="best-mandi-name">${best.mandi_name}</div>
          <div class="best-tagline">${best.distance_km.toFixed(0)} km away &nbsp;·&nbsp; Sell <strong>${data.quantity.toLocaleString()} kg</strong> of ${data.crop}</div>

          <div class="profit-hero">
            <div>
              <div class="profit-label">Your Net Profit</div>
              <div class="profit-sub">After transport &amp; all costs</div>
            </div>
            <div style="text-align:right">
              <div class="profit-value">${fmt(best.net_profit)}</div>
            </div>
          </div>

          <div class="stats-row">
            <div class="stat-box">
              <div class="sv">${fmt(best.current_price)}/kg</div>
              <div class="sl">Current Price</div>
            </div>
            <div class="stat-box">
              <div class="sv">${fmt(best.gross_revenue)}</div>
              <div class="sl">Gross Revenue</div>
            </div>
            <div class="stat-box">
              <div class="sv">${fmt(best.transport_cost)}</div>
              <div class="sl">Transport Cost</div>
            </div>
            ${pred7d}
          </div>

          <div class="action-badge">📌 &nbsp;${best.recommendation}</div>
        </div>
      </div>

      ${alts.length ? `
        <div class="alt-header">📋 Other Options (lower profit)</div>
        <div class="alt-list">${altsHtml}</div>
      ` : ''}
    `;

            document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    </script>
</body>

</html>
